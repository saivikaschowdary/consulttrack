<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConsultTrack — Employee Database</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f0e0c;
  --ink-2: #3a3830;
  --ink-3: #7a7770;
  --surface: #faf9f7;
  --surface-2: #f2f0ec;
  --surface-3: #e8e4de;
  --accent: #2d4a3e;
  --accent-2: #4a7c65;
  --accent-light: #e8f2ed;
  --amber: #b8722a;
  --amber-light: #fdf3e3;
  --red: #a33030;
  --red-light: #fce8e8;
  --blue: #2a4a7a;
  --blue-light: #e8eef8;
  --border: rgba(15,14,12,0.1);
  --border-strong: rgba(15,14,12,0.18);
  --radius: 10px;
  --radius-lg: 14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;line-height:1.6}
.topnav{position:sticky;top:0;z-index:100;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;border-bottom:1px solid rgba(255,255,255,0.06)}
.topnav-brand{display:flex;align-items:baseline;gap:10px}
.topnav-brand h1{font-family:'DM Serif Display',serif;font-size:1.25rem;color:#fff;font-weight:400;letter-spacing:-0.02em}
.topnav-brand span{font-size:0.7rem;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.12em}
.topnav-nav{display:flex;gap:2px}
.topnav-nav a{padding:5px 13px;border-radius:6px;font-size:0.81rem;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.15s;text-decoration:none}
.topnav-nav a:hover{color:#fff;background:rgba(255,255,255,0.08)}
.topnav-nav a.active{color:#fff;background:rgba(255,255,255,0.13)}
.topnav-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius);border:1px solid var(--border-strong);background:transparent;color:var(--ink);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;transition:all 0.15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:5px 13px;font-size:0.79rem}
.btn-white{background:#fff;color:var(--ink);border-color:var(--border-strong)}
.btn-white:hover{background:var(--surface-2)}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border)}
.btn-green{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-green:hover{background:var(--accent-2)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:210px;min-width:210px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:22px 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.sidebar-section{padding:0 12px;margin-bottom:20px}
.sidebar-label{font-size:0.67rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);padding:0 8px;margin-bottom:5px;display:block}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:0.83rem;color:var(--ink-2);transition:all 0.12s;margin-bottom:1px}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:0.55}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-item.active svg{opacity:1}
.sidebar-divider{height:1px;background:var(--border);margin:14px 12px}
.main{flex:1;min-width:0}
.page-header{padding:26px 32px 0;margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between}
.page-header-left h2{font-family:'DM Serif Display',serif;font-size:1.7rem;font-weight:400;letter-spacing:-0.03em;line-height:1.1;margin-bottom:3px}
.page-header-left p{font-size:0.81rem;color:var(--ink-3)}
.page-body{padding:0 32px 48px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.card-padded{padding:20px 22px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.metric-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.metric-card.mc-green::before{background:var(--accent)}
.metric-card.mc-amber::before{background:var(--amber)}
.metric-card.mc-red::before{background:var(--red)}
.metric-card.mc-blue::before{background:var(--blue)}
.metric-label{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);margin-bottom:7px}
.metric-val{font-family:'DM Serif Display',serif;font-size:2.1rem;font-weight:400;line-height:1;margin-bottom:3px}
.metric-val.cv-green{color:var(--accent)}
.metric-val.cv-amber{color:var(--amber)}
.metric-val.cv-red{color:var(--red)}
.metric-val.cv-blue{color:var(--blue)}
.metric-sub{font-size:0.73rem;color:var(--ink-3)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.83rem}
thead th{text-align:left;padding:11px 16px;font-size:0.68rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:0.7rem;font-weight:600;white-space:nowrap;letter-spacing:0.02em}
.badge-green{background:var(--accent-light);color:var(--accent)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-gray{background:var(--surface-2);color:var(--ink-3)}
.badge-ink{background:var(--ink);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:600;flex-shrink:0}
.emp-cell{display:flex;align-items:center;gap:9px}
.emp-cell-name{font-weight:500;font-size:0.84rem;display:block}
.emp-cell-sub{font-size:0.72rem;color:var(--ink-3);display:block}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.search-wrap{position:relative;flex:1;max-width:340px}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border-strong);border-radius:var(--radius);background:#fff;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:0.83rem}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3);pointer-events:none}
select{padding:8px 11px;border:1px solid var(--border-strong);border-radius:var(--radius);background:#fff;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:0.83rem;cursor:pointer}
select:focus{outline:none;border-color:var(--accent)}
.alert{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:var(--radius);font-size:0.82rem;margin-bottom:14px}
.alert-amber{background:var(--amber-light);color:var(--amber);border:1px solid rgba(184,114,42,0.2)}
.alert-red{background:var(--red-light);color:var(--red);border:1px solid rgba(163,48,48,0.2)}
.alert svg{flex-shrink:0;width:15px;height:15px}
.alert a{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.rating-bar{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rating-label{font-size:0.77rem;color:var(--ink-3);width:110px;flex-shrink:0}
.bar-track{flex:1;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:2px}
.rating-score{font-size:0.77rem;font-weight:600;color:var(--ink-2);width:28px;text-align:right}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:9px 17px;font-size:0.82rem;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);font-weight:500;border-bottom-color:var(--accent)}
.review-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px}
.review-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px}
.review-score{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--accent);line-height:1}
.review-score-sub{font-size:0.7rem;color:var(--ink-3);text-align:right;margin-top:2px}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(15,14,12,0.45);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);animation:fadeIn 0.15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:0 8px 40px rgba(15,14,12,0.15),0 2px 8px rgba(15,14,12,0.08);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;animation:slideUp 0.18s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 0}
.modal-header h3{font-family:'DM Serif Display',serif;font-size:1.25rem;font-weight:400}
.modal-body{padding:18px 26px 24px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 26px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-3)}
.form-group input,.form-group select,.form-group textarea{padding:8px 11px;border:1px solid var(--border-strong);border-radius:var(--radius);background:#fff;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:0.84rem}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-divider{grid-column:1/-1;height:1px;background:var(--border);margin:2px 0}
.form-section-label{grid-column:1/-1;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);padding-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
.detail-item label{display:block;font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-3);margin-bottom:3px}
.detail-item span{font-size:0.84rem;color:var(--ink)}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px}
.skill-tag{padding:3px 10px;border-radius:20px;font-size:0.73rem;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.email-meta{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.email-meta-row{display:flex;gap:8px;font-size:0.81rem;margin-bottom:3px}
.email-meta-row:last-child{margin-bottom:0}
.email-meta-row label{font-weight:600;color:var(--ink-3);min-width:54px}
.email-body-preview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;font-size:0.82rem;line-height:1.75;color:var(--ink-2);max-height:190px;overflow-y:auto;white-space:pre-wrap;margin-bottom:12px}
.email-hint{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--ink-3);margin-bottom:0}
.success-banner{display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:var(--radius);background:var(--accent-light);border:1px solid rgba(45,74,62,0.2);font-size:0.82rem;color:var(--accent);margin-top:14px}
.success-banner svg{flex-shrink:0;width:17px;height:17px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.dept-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.dept-bar-label{font-size:0.81rem;width:85px;flex-shrink:0;color:var(--ink-2)}
.dept-bar-track{flex:1;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.dept-bar-fill{height:100%;background:var(--accent);border-radius:2px}
.dept-bar-count{font-size:0.76rem;font-weight:600;color:var(--ink-3);width:14px;text-align:right}
.settings-section{max-width:540px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px}
.spinner-dark{border-color:rgba(45,74,62,0.15);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:880px){.sidebar{display:none}.metric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

const AV=[['#e8f2ed','#2d4a3e'],['#e8eef8','#2a4a7a'],['#fdf3e3','#b8722a'],['#fce8e8','#a33030'],['#f0edf8','#5a3d8a']];
function ac(i){return AV[i%AV.length];}
function mkAv(ini,i,s=30){const[bg,fg]=ac(i);return`<div class="avatar" style="width:${s}px;height:${s}px;background:${bg};color:${fg};font-size:${s*0.33}px">${ini}</div>`;}
function mkIni(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function navigate(page){
  currentPage=page;
  document.querySelectorAll('.nav-item,.topnav-nav a').forEach(el=>el.classList.remove('active'));
  const s=document.getElementById('side-'+page);const n=document.getElementById('nav-'+page);
  if(s)s.classList.add('active');if(n)n.classList.add('active');
  render();
}
function render(){
  const el=document.getElementById('main-content');
  if(currentPage==='dashboard')el.innerHTML=rDash();
  else if(currentPage==='employees')el.innerHTML=rEmp();
  else if(currentPage==='visas')el.innerHTML=rVisa();
  else if(currentPage==='reviews')el.innerHTML=rReviews();
  else if(currentPage==='settings')el.innerHTML=rSettings();
}
function sBadge(s){return s==='Active'?'<span class="badge badge-green">Active</span>':'<span class="badge badge-amber">Bench</span>';}
function pBadge(e){return e.profileComplete?'<span class="badge badge-green">Complete</span>':'<span class="badge badge-amber">Pending</span>';}
function vBadge(v){
  if(v.type==='Citizen'||v.type==='Green Card')return`<span class="badge badge-blue">${v.type}</span>`;
  const d=Math.ceil((new Date(v.expiry)-new Date())/86400000);
  if(d<90)return`<span class="badge badge-red">${v.type} · ${d}d</span>`;
  if(d<180)return`<span class="badge badge-amber">${v.type}</span>`;
  return`<span class="badge badge-gray">${v.type}</span>`;
}

    </div>

      </div>

    <div class="card table-wrap"><table><thead><tr><th>Employee</th><th>Type</th><th>Date</th><th>Score</th><th>Status</th></tr></thead><tbody>${rr}</tbody></table></div>

function rVisa(){

async function saveEmp(id,isNew){
  const v={name:document.getElementById('f-name').value.trim(),title:document.getElementById('f-title').value.trim(),dept:document.getElementById('f-dept').value,email:document.getElementById('f-email').value.trim(),phone:document.getElementById('f-phone').value.trim(),location:document.getElementById('f-loc').value.trim(),manager:document.getElementById('f-mgr').value.trim(),status:document.getElementById('f-status').value,client:document.getElementById('f-client').value.trim(),project:document.getElementById('f-project').value.trim(),visa:{type:document.getElementById('f-visa').value,expiry:document.getElementById('f-vexp').value||'N/A',country:document.getElementById('f-country').value.trim()},skills:document.getElementById('f-skills').value.split(',').map(s=>s.trim()).filter(Boolean),profileComplete:false};
  if(!v.name||!v.email){alert('Name and email are required.');return;}
  const btn=document.getElementById('save-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Saving...';
  if(id){
    const i=employees.findIndex(e=>e.id===id);
    v.id=id;v.initials=mkIni(v.name);v.joinDate=employees[i].joinDate;v.profileComplete=employees[i].profileComplete;
    employees[i]={...employees[i],...v};closeModal();navigate('employees');
  } else {
    v.id=employees.length+1;v.initials=mkIni(v.name);v.joinDate=new Date().toISOString().split('T')[0];
    employees.push(v);await showEmailComposer(v);
  }
}
async function showEmailComposer(emp){
  showModal(`<div class="modal-header"><h3>Welcome Email</h3><button class="btn btn-ghost btn-sm" onclick="closeModal();navigate('employees')">&#x2715;</button></div>
  <div class="modal-body">
    <p style="font-size:0.83rem;color:var(--ink-3);margin-bottom:18px">Profile created. Composing a welcome email for <strong style="color:var(--ink)">${emp.name}</strong>...</p>
    <div id="email-loading" style="text-align:center;padding:36px 0"><span class="spinner spinner-dark" style="width:20px;height:20px;border-width:3px"></span><div style="margin-top:12px;font-size:0.83rem;color:var(--ink-3)">Generating personalised email with Claude...</div></div>
    <div id="email-ready" style="display:none"></div>
  </div>
  <div class="modal-footer" id="email-footer" style="display:none"></div>`);
  try{
    const body=await genEmail(emp);
    const subject=`Welcome to Acme Consulting Partners — please complete your profile, ${emp.name.split(' ')[0]}`;
    const mailto=`mailto:${encodeURIComponent(emp.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    document.getElementById('email-loading').style.display='none';
    document.getElementById('email-ready').style.display='block';
    document.getElementById('email-ready').innerHTML=`<div class="email-meta"><div class="email-meta-row"><label>From:</label><span>${hrEmail}</span></div><div class="email-meta-row"><label>To:</label><span>${emp.email}</span></div><div class="email-meta-row"><label>Subject:</label><span>${subject}</span></div></div><div class="email-body-preview">${body}</div><div class="email-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Clicking "Send Email" opens Gmail pre-filled and ready to send.</div>`;
    document.getElementById('email-footer').style.display='flex';
    document.getElementById('email-footer').innerHTML=`<button class="btn btn-ghost" onclick="closeModal();navigate('employees')">Skip</button><a class="btn btn-green" href="${mailto}" onclick="markSent(${emp.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Send Email</a>`;
  } catch(err){
    document.getElementById('email-loading').innerHTML=`<div style="color:var(--red);font-size:0.83rem">Could not generate email: ${err.message}</div>`;
  }
}
function markSent(empId){
  setTimeout(()=>{
    const r=document.getElementById('email-ready');const f=document.getElementById('email-footer');
    if(r)r.insertAdjacentHTML('beforeend',`<div class="success-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Email client opened — check your compose window and hit Send.</div>`);
    if(f)f.innerHTML=`<button class="btn btn-ghost" onclick="closeModal();navigate('employees')">Done</button>`;
  },700);
}
async function genEmail(emp){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:`Write a professional warm welcome email to a new consulting firm employee from HR asking them to complete their online profile.\n\nEmployee:\n- Name: ${emp.name}\n- Title: ${emp.title}\n- Department: ${emp.dept}\n- Manager: ${emp.manager}\n- Start Date: ${emp.joinDate}\n- HR Email: ${hrEmail}\n\nRequirements:\n1. Welcome them warmly by first name\n2. Say their basic profile was created by HR\n3. Ask them to visit https://consulttrack.app/profile/complete to fill in: emergency contacts, biography, profile photo, certifications, preferred working hours, additional skills\n4. Ask them to complete within 3 business days\n5. Under 150 words, professional but warm\n6. Sign off as: The HR Team, Acme Consulting Partners\n\nOutput ONLY the plain email body text. No subject, no markdown, no JSON.`}]})});
  if(!res.ok)throw new Error(`API error ${res.status}`);
  const data=await res.json();
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
}

function saveReview(){
  reviews.push({id:reviews.length+1,empId:parseInt(document.getElementById('r-emp').value),period:document.getElementById('r-period').value,date:document.getElementById('r-date').value,manager:document.getElementById('r-mgr').value,scores:{delivery:parseInt(document.getElementById('r-delivery').value),communication:parseInt(document.getElementById('r-communication').value),innovation:parseInt(document.getElementById('r-innovation').value),teamwork:parseInt(document.getElementById('r-teamwork').value)},notes:document.getElementById('r-notes').value||'No notes provided.',status:'Submitted'});
